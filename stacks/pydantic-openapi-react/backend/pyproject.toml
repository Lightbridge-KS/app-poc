[project]
name = "poc-backend"
version = "0.1.0"
description = "FastAPI half of the OpenAPI-from-Pydantic PoC — the contract lives here."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
